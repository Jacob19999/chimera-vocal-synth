[package]
name = "chimera-cli"
description = "CHIMERA command-line tools: offline renders to WAV, speech diagnostics, calibration"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "chimera"
path = "src/main.rs"

[dependencies]
chimera = { path = "../chimera" }
flate2 = "1"
chimera-score = { path = "../chimera-score" }
serde = "1"
serde_json = "1"

[dev-dependencies]
zip = { version = "4.6", default-features = false, features = ["deflate-flate2"] }
